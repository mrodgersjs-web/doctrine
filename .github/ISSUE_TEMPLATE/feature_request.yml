name: Feature request
description: Propose a validation rule, CLI command, or doctrine schema change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the loader, validator or CLI cannot express today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would add and how it would be checked.
    validations:
      required: true
