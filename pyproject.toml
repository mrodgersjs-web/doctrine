[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-doctrine"
version = "0.1.0"
description = "Loader and validator for the RIG doctrine repository, with a list/show/validate CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mike Rodgers" }]
keywords = ["doctrine", "agents", "validation", "markdown", "operating-rules"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/doctrine"
Repository = "https://github.com/mrodgersjs-web/doctrine"
Issues = "https://github.com/mrodgersjs-web/doctrine/issues"

[project.scripts]
rig-doctrine = "rig_doctrine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rig_doctrine = ["py.typed"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
