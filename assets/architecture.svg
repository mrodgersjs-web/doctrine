<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Doctrine enforcement architecture">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0D0A07"/>
    <stop offset="55%" stop-color="#0A0806"/>
    <stop offset="100%" stop-color="#0B0705"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8A7148"/>
    <stop offset="50%" stop-color="#C8A96E"/>
    <stop offset="100%" stop-color="#E8CD98"/>
  </linearGradient>
  <linearGradient id="goldGradSoft" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.15"/>
    <stop offset="50%" stop-color="#C8A96E" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#C8A96E" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="panelFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#181109"/>
    <stop offset="100%" stop-color="#0E0A06"/>
  </linearGradient>
  <linearGradient id="panelFillLit" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#211708"/>
    <stop offset="100%" stop-color="#120C07"/>
  </linearGradient>
  <linearGradient id="panelFillRust" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#20130F"/>
    <stop offset="100%" stop-color="#140B08"/>
  </linearGradient>
  <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowGoldFaint" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowCream" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F5F0EB" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#F5F0EB" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowRust" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#9A5A48" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#9A5A48" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowSage" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7C9482" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#7C9482" stop-opacity="0"/>
  </radialGradient>
  <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <filter id="fineGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arrowGold" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C8A96E"/>
  </marker>
  <marker id="arrowStone" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#A09890"/>
  </marker>
  <marker id="arrowRust" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9A5A48"/>
  </marker>
  <marker id="arrowSage" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7C9482"/>
  </marker>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#F5F0EB" stroke-opacity="0.028" stroke-width="1"/>
  </pattern>
</defs>

  <rect x="0" y="0" width="1200" height="400" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="400" fill="url(#grid)"/>
  
  <circle cx="140" cy="200" r="170" fill="url(#glowGoldFaint)"/>
  <circle cx="1080" cy="140" r="140" fill="url(#glowSage)"/>
  <circle cx="1080" cy="280" r="140" fill="url(#glowRust)"/>

  <rect x="0.5" y="0.5" width="1199" height="399" fill="none" stroke="#C8A96E" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="40" y1="368" x2="1160" y2="368" stroke="url(#goldGradSoft)" stroke-width="1"/>

  <text x="44" y="24" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2" fill="#C8A96E">RULES AN AGENT CANNOT ARGUE WITH</text>
  <text x="44" y="56" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-style="italic" font-size="30" fill="#F5F0EB">Doctrine</text>
  <text x="1156" y="40" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" letter-spacing="0.5" fill="#A09890">doctrine.enforce()</text>
  <line x1="44" y1="70" x2="108" y2="70" stroke="#C8A96E" stroke-width="1.5"/>

  <g>
    
    <rect x="52" y="164" width="156" height="92" rx="14" fill="url(#panelFillLit)" stroke="#C8A96E" stroke-opacity="0.38" stroke-width="1.1"/>
    <rect x="52" y="164" width="156" height="2" rx="1" fill="#C8A96E" opacity="0.55"/>
    <text x="130.0" y="204.0" text-anchor="middle" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" letter-spacing="0.3" fill="#F5F0EB">RULES</text>
    <text x="130.0" y="228.0" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#A09890">written doctrine</text>
  </g><g transform="translate(130,194) scale(0.95)">
    <path d="M0,-10 C-4,-13 -12,-13 -14,-11 L-14,10 C-12,8 -4,8 0,11 Z" fill="none" stroke="#E8CD98" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M0,-10 C4,-13 12,-13 14,-11 L14,10 C12,8 4,8 0,11 Z" fill="none" stroke="#E8CD98" stroke-width="1.8" stroke-linejoin="round"/>
  </g><path d="M208,210 C279.0,210 279.0,210 350,210" fill="none" stroke="#C8A96E" stroke-width="1.8"  opacity="1" marker-end="url(#arrowGold)" stroke-linecap="round"/><circle cx="390" cy="210" r="48" fill="url(#glowGold)" filter="url(#softBlur)" opacity="0.55"/><circle cx="390" cy="210" r="42" fill="url(#panelFillLit)" stroke="#C8A96E" stroke-width="1.8"/><g transform="translate(390,210) scale(1.3)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#F5F0EB" stroke-width="2"/>
    <circle cx="-5" cy="-4" r="2" fill="#F5F0EB"/>
    <circle cx="6" cy="-2" r="2" fill="#F5F0EB"/>
    <circle cx="-2" cy="6" r="2" fill="#F5F0EB"/>
    <circle cx="6" cy="6" r="1.6" fill="#F5F0EB" opacity="0.8"/>
    <path d="M-5,-4 L6,-2 M6,-2 L-2,6 M-2,6 L-5,-4 M6,-2 L6,6" stroke="#F5F0EB" stroke-width="1.2" opacity="0.65"/>
  </g><text x="390" y="278" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" letter-spacing="0.4" fill="#C8A96E">AGENT</text><text x="390" y="294" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9.5" letter-spacing="0.4" fill="#A09890">reads doctrine at runtime</text><path d="M432,210 C523.0,210 523.0,210 614,210" fill="none" stroke="#C8A96E" stroke-width="1.8"  opacity="1" marker-end="url(#arrowGold)" stroke-linecap="round"/><path transform="translate(660,210) scale(1.9)" d="M0,-13 L13,0 L0,13 L-13,0 Z" fill="url(#panelFillLit)" stroke="#C8A96E" stroke-width="1.8" stroke-linejoin="round"/><text x="660" y="208" text-anchor="middle" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="0.4" fill="#F5F0EB">CHECK</text><text x="660" y="264" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9.5" letter-spacing="0.4" fill="#A09890">compliance test</text><path d="M706,204 C788.0,204 788.0,130 870,130" fill="none" stroke="#7C9482" stroke-width="1.7"  opacity="1" marker-end="url(#arrowSage)" stroke-linecap="round"/><path d="M706,216 C788.0,216 788.0,300 870,300" fill="none" stroke="#9A5A48" stroke-width="1.7"  opacity="1" marker-end="url(#arrowRust)" stroke-linecap="round"/><rect x="870" y="98" width="180" height="64" rx="12" fill="url(#panelFillLit)" stroke="#7C9482" stroke-width="1.6"/><g transform="translate(898,130) scale(0.9)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#7C9482" stroke-width="2"/>
    <path d="M-6,0 L-1.5,5 L7,-6" fill="none" stroke="#7C9482" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g><text x="958" y="128" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="0.8" fill="#7C9482">APPROVED</text><text x="958" y="146" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9.5" letter-spacing="0.4" fill="#A09890">proceeds</text><rect x="870" y="268" width="180" height="64" rx="12" fill="url(#panelFillLit)" stroke="#9A5A48" stroke-width="1.6"/><g transform="translate(898,300) scale(0.9)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#9A5A48" stroke-width="2"/>
    <path d="M-5.5,-5.5 L5.5,5.5 M5.5,-5.5 L-5.5,5.5" stroke="#9A5A48" stroke-width="2.3" stroke-linecap="round"/>
  </g><text x="958" y="298" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="0.8" fill="#9A5A48">BLOCKED</text><text x="958" y="316" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9.5" letter-spacing="0.4" fill="#A09890">halts, logs why</text><text x="44" y="386" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="0.8" fill="#A09890">doctrine is read at runtime, not persuaded away</text><text x="1156" y="386" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#A09890">RULES → AGENT → CHECK</text></svg>